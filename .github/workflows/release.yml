name: Release

# Publica o AppImage + .deb (Linux) e o .dmg (macOS) no GitHub Releases:
#   git tag v1.0.0 && git push origin v1.0.0
# Também pode ser disparado à mão (Actions → Release → Run workflow): gera os
# artefatos para download, sem criar a release.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  VERSION: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}

jobs:
  linux:
    # 22.04: glibc mais antiga => o AppImage roda em mais distribuições
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Dependências do Tauri
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev patchelf file
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: cargo-tauri
        run: command -v cargo-tauri || cargo install tauri-cli --version "^2" --locked
      - run: cargo test --workspace
      - run: ./x dist ${{ env.VERSION }}
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/*

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: cargo-tauri
        run: command -v cargo-tauri || cargo install tauri-cli --version "^2" --locked
      - run: ./x dist ${{ env.VERSION }}
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist/*

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Checksums
        run: |
          mkdir out
          cp artifacts/linux/AVD-Menu-* artifacts/linux/avd-menu-* artifacts/macos/AVD-Menu-* out/
          cd out && sha256sum * > SHA256SUMS && cat SHA256SUMS
      - name: Cria a release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" out/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "AVD Menu $GITHUB_REF_NAME" \
            --generate-notes
