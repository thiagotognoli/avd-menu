[package]
name = "avdcore"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Núcleo do AVD Menu: SDK Manager + Device Manager do Android sem Java"

[dependencies]
base64 = "0.23.1"
hex = "0.4.3"
libc = "0.2.189"
png = "0.18.1"
roxmltree = "0.21.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha1 = "0.11.0"
tiny_http = { version = "0.12.0", optional = true }
ureq = { version = "3.4.2", features = ["platform-verifier"] }
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }

[features]
# Servidor HTTP só para desenvolvimento/testes da interface no navegador (não vai no app).
devserver = ["dep:tiny_http"]

[[bin]]
name = "avd-menu-cli"
path = "src/bin/avd-menu-cli.rs"

[[bin]]
name = "devserver"
path = "src/bin/devserver.rs"
required-features = ["devserver"]

[target.'cfg(target_os = "linux")'.dependencies]
x11rb = "0.14.0"
